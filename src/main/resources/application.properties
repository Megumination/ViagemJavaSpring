spring.application.name=cadastro-viagem

# PostgreSQL local (crie o banco cadastro_viagem no pgAdmin)
spring.datasource.url=jdbc:postgresql://localhost:5432/cadastro_viagem
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# O Hibernate cria/atualiza a tabela a partir da entidade Viagem
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Aplicação e frontend
server.port=8081
