$kind: http-request
url: "{{baseUrl}}/viagem"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Listagem concluída', function () { pm.response.to.have.status(200); });
      pm.test('Resposta é uma lista', function () { pm.expect(pm.response.json()).to.be.an('array'); });
    language: text/javascript
order: 2000
